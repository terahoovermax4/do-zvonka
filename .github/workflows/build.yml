name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: DoZvonka-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Опубликовать как релиз (ссылка для друзей)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DoZvonka.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DoZvonka.apk --title "До звонка — последняя сборка" --notes "Собрано автоматически из ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Если сборка упала — кладём лог в ветку build-logs, чтобы его можно было прочитать и починить.
      - name: Сохранить лог ошибки
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "лог не создан" > /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Лог сборки ${GITHUB_SHA::7}"
          git push -f origin build-logs
